OpenIDE-Module-Name=Radial Jog
OpenIDE-Module-Short-Description=FluidNC-style radial jog pad where each ring is a step distance
OpenIDE-Module-Long-Description=A jog controller panel inspired by the FluidNC/ESP3D WebUI bullseye jog pad. \
Each concentric ring is a jog step distance (0.1, 1, 10, 50 and 100 mm) and the direction is chosen by \
the angle from the centre. Drag out from the centre and release to jog that distance in that direction. \
A separate stepped control on the right jogs the Z axis.
OpenIDE-Module-Display-Category=UGS
